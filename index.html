<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Altseason Crypto Terminal</title>

<link rel="manifest" href="manifest.json">

<style>
body{
margin:0;
background:#0f1115;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
color:white;
padding:16px;
}

h1{
font-size:28px;
margin-bottom:6px;
}

.sub{
color:#999;
margin-bottom:20px;
}

.card{
background:#1a1d24;
border-radius:18px;
padding:16px;
margin-bottom:14px;
}

.metric{
display:flex;
justify-content:space-between;
margin-bottom:10px;
font-size:16px;
}

.green{color:#43d17a;}
.red{color:#ff5c5c;}
.yellow{color:#ffd166;}

input,select{
width:100%;
padding:12px;
margin-top:8px;
margin-bottom:10px;
border:none;
border-radius:12px;
background:#2a2f39;
color:white;
font-size:16px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:14px;
background:#3b82f6;
color:white;
font-size:16px;
font-weight:600;
}

.coin{
padding:12px;
border-bottom:1px solid #2d323d;
}

.pnlpos{color:#43d17a;}
.pnlneg{color:#ff5c5c;}

.tabs{
display:flex;
gap:8px;
margin-bottom:16px;
}

.tab{
flex:1;
text-align:center;
padding:10px;
background:#1a1d24;
border-radius:12px;
}

.active{
background:#3b82f6;
}

.hidden{
display:none;
}
</style>
</head>

<body>

<h1>🚀 Altseason Terminal</h1>
<div class="sub">Crypto Market Radar</div>

<div class="tabs">
<div class="tab active" onclick="showTab('radar')">Радар</div>
<div class="tab" onclick="showTab('portfolio')">Портфель</div>
<div class="tab" onclick="showTab('keys')">Ключи</div>
</div>

<div id="radar">

<div class="card">
<div class="metric">
<span>BTC Dominance</span>
<span id="btcdom">...</span>
</div>

<div class="metric">
<span>ETH Dominance</span>
<span id="ethdom">...</span>
</div>

<div class="metric">
<span>ETH/BTC</span>
<span id="ethbtc">...</span>
</div>

<div class="metric">
<span>Fear & Greed</span>
<span id="fear">...</span>
</div>

<div class="metric">
<span>Altseason Readiness</span>
<span id="altscore" class="yellow">62%</span>
</div>

</div>

<div class="card">
<h3>📊 Market Status</h3>
<div id="marketstatus" class="yellow">
Ранний переход к альтам
</div>
</div>

</div>

<div id="portfolio" class="hidden">

<div class="card">

<input id="search" placeholder="BTC, ETH, SOL...">

<input id="amount" placeholder="Количество">

<input id="buyprice" placeholder="Средняя цена покупки">

<input type="date" id="buydate">

<button onclick="addCoin()">Добавить монету</button>

</div>

<div class="card">
<h3>💼 Мой портфель</h3>
<div id="coins"></div>
</div>

</div>

<div id="keys" class="hidden">

<div class="card">

<input id="coinglass" placeholder="CoinGlass API Key">

<button onclick="saveKey()">Сохранить ключ</button>

</div>

</div>

<script>

let portfolio = JSON.parse(localStorage.getItem("portfolio") || "[]");

function showTab(tab){

document.getElementById("radar").classList.add("hidden");
document.getElementById("portfolio").classList.add("hidden");
document.getElementById("keys").classList.add("hidden");

document.getElementById(tab).classList.remove("hidden");

document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));

if(tab==="radar"){
document.querySelectorAll(".tab")[0].classList.add("active");
}

if(tab==="portfolio"){
document.querySelectorAll(".tab")[1].classList.add("active");
}

if(tab==="keys"){
document.querySelectorAll(".tab")[2].classList.add("active");
}

}

async function loadMarket(){

try{

let global = await fetch('https://api.coingecko.com/api/v3/global');
let data = await global.json();

let btcd = data.data.market_cap_percentage.btc.toFixed(1);
let ethd = data.data.market_cap_percentage.eth.toFixed(1);

document.getElementById("btcdom").innerHTML =
btcd < 50
? `<span class="green">${btcd}%</span>`
: `<span class="red">${btcd}%</span>`;

document.getElementById("ethdom").innerHTML =
`<span class="green">${ethd}%</span>`;

let fear = await fetch('https://api.alternative.me/fng/');
let fdata = await fear.json();

let fearval = fdata.data[0].value;

document.getElementById("fear").innerHTML =
fearval > 60
? `<span class="green">${fearval}</span>`
: `<span class="yellow">${fearval}</span>`;

let btc = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=btc,usd');
let bdata = await btc.json();

let ethbtc = bdata.ethereum.btc.toFixed(4);

document.getElementById("ethbtc").innerHTML =
ethbtc > 0.04
? `<span class="green">${ethbtc}</span>`
: `<span class="yellow">${ethbtc}</span>`;

let score = 50;

if(btcd < 55) score += 10;
if(btcd < 52) score += 10;
if(ethbtc > 0.035) score += 10;
if(ethbtc > 0.045) score += 10;
if(fearval > 55) score += 10;

document.getElementById("altscore").innerHTML = score + "%";

if(score < 40){
document.getElementById("marketstatus").innerHTML =
"BTC Season";
}

if(score >= 40 && score < 70){
document.getElementById("marketstatus").innerHTML =
"Переход к альтам";
}

if(score >= 70){
document.getElementById("marketstatus").innerHTML =
"🔥 Altseason";
}

}catch(e){
console.log(e);
}

}

async function addCoin(){

let coin = document.getElementById("search").value.toLowerCase();
let amount = document.getElementById("amount").value;
let buy = document.getElementById("buyprice").value;
let date = document.getElementById("buydate").value;

if(!coin)return;

portfolio.push({
coin,
amount,
buy,
date
});

localStorage.setItem("portfolio",JSON.stringify(portfolio));

renderPortfolio();

}

async function renderPortfolio(){

let html = "";

for(let c of portfolio){

try{

let res = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${c.coin}&vs_currencies=usd`);
let data = await res.json();

let current = data[c.coin]?.usd || 0;

let value = (current * c.amount).toFixed(2);

let invested = (c.buy * c.amount).toFixed(2);

let pnl = (value - invested).toFixed(2);

html += `
<div class="coin">
<div><b>${c.coin.toUpperCase()}</b></div>
<div>Кол-во: ${c.amount}</div>
<div>Средняя: $${c.buy}</div>
<div>Сейчас: $${current}</div>
<div>Стоимость: $${value}</div>
<div class="${pnl >=0 ? 'pnlpos':'pnlneg'}">
PnL: $${pnl}
</div>
</div>
`;

}catch(e){}

}

document.getElementById("coins").innerHTML = html;

}

function saveKey(){

let key = document.getElementById("coinglass").value;

localStorage.setItem("coinglass",key);

alert("API ключ сохранён");

}

loadMarket();
renderPortfolio();

setInterval(loadMarket,300000);

</script>

</body>
</html>
